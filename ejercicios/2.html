<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 2 - Color en Consola</title>
    <script>
        function mostrarColor() {
            let color = document.getElementById("listaColores").value; // [4, 6]
            console.log("Color seleccionado: " + color); // [4]
        }
    </script>
</head>
<body>
    <h1>Seleccionar Color</h1>
    <label for="listaColores">Elija un color:</label>
    <select id="listaColores" onchange="mostrarColor()">
        <option value="">-- Seleccione un color --</option>
        <option value="Rojo">Rojo</option>
        <option value="Verde">Verde</option>
        <option value="Azul">Azul</option>
        <option value="Amarillo">Amarillo</option>
    </select>
</body>
</html>
