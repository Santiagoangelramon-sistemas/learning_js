<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operador Ternario</title>

<script>
    var nota = 7;
    console.log("Resultado de mi examen: ");

    // operador ternario (condicion? verdadero : falso)
    var resultado = (nota >= 5) ? "Aprobado" : "Reprobado";
    console.log("Estoy ", resultado);
</script>
</body>
</html>
